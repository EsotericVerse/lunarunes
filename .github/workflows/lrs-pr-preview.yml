name: LRS GitHub PR Worker Preview

# GitHub owns this PR preview trigger; production is owned by the separate
# main release flow. Never publish a production Worker from this workflow.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lrs-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Repository secrets must never be exposed to untrusted fork pull requests.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked independent LRS dependencies
        run: npm ci --no-audit --no-fund
      - name: Build only LRS Worker and its required static assets
        run: npm run build:cloudflare
      - name: Publish isolated Cloudflare Worker Preview (never production)
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Cloudflare Account ID is a public account identifier, not a credential.
          CLOUDFLARE_ACCOUNT_ID: f730f29a620a25bb047a69d542457fc0
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'LRS CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          test -s dist/cloudflare/index.html
          output="$(npx wrangler preview --name "pr-${{ github.event.pull_request.number }}" --json)"
          printf '%s\n' "$output"
          url="$(printf '%s\n' "$output" | sed -n '/^{/,$p' | jq -er '.preview.urls[0]')"
          printf 'preview_url=%s\n' "$url" >> "$GITHUB_OUTPUT"
          {
            echo '### LRS Cloudflare Worker Preview'
            echo ''
            echo "Preview: $url"
            echo ''
            echo 'This is a PR-only preview; production and other repositories are unchanged.'
          } >> "$GITHUB_STEP_SUMMARY"
