name: Verify LRS single source ownership (no deployment)
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'modules/**'
      - 'web/**'
      - 'scripts/check-lrs-source-ownership.mjs'
      - 'tests/lrs-single-source.test.mjs'
      - '.github/workflows/verify-lrs-single-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check canonical Rune source paths and reference graph
        run: node scripts/check-lrs-source-ownership.mjs
      - name: Test Rune Hero and daily behavior without database access
        run: node --test tests/lrs-single-source.test.mjs
      - name: No deployment or cross-repo writes
        run: echo "LRS-only source boundary; no database, Worker or Preview changes"
