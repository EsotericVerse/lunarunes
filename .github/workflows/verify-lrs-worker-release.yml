name: Verify LunaRunes full Worker release (no deployment)
on:
  pull_request:
    branches: [main]
    paths:
      - 'wrangler.jsonc'
      - 'web/**'
      - 'tests/lrs-web-static-cache.test.mjs'
      - 'tests/lrs-public-read-dedupe.test.mjs'
      - 'index.mjs'
      - 'lrs-database.mjs'
      - 'public-rune-read.mjs'
      - 'vendor/loc-dialect/**'
      - 'tests/lrs-original-pages.test.mjs'
      - 'scripts/deploy-rune-cloudflare.mjs'
      - 'docs/CLOUDFLARE-DEPLOY.md'
      - 'tests/lrs-cloudflare-deploy.test.mjs'
      - 'scripts/assemble-rune-cloudflare.mjs'
      - 'scripts/rune-media-version.mjs'
      - 'tests/lrs-media-version.test.mjs'
      - 'scripts/check-rune-cloudflare-release.mjs'
      - 'release/version.json'
      - 'scripts/prepare-rune-**'
      - 'scripts/build-rune-artifacts.mjs'
      - 'scripts/prepare-lrs-release-assets.mjs'
      - 'scripts/build-lrs-modules.mjs'
      - 'modules/lrs/rune/**'
      - 'contracts/rune-original-art.json'
      - 'assets/**'
      - 'package.json'
      - '.github/workflows/verify-lrs-worker-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install independent LRS dependencies
        run: npm install --no-audit --no-fund
      - name: Verify bounded Web cache never stores Rune images, VFX, SQL or local records
        run: node --test tests/lrs-web-static-cache.test.mjs tests/lrs-public-read-dedupe.test.mjs
      - name: Verify the exact public Rune read allowlist
        run: node --test tests/lrs-original-pages.test.mjs tests/lrs-media-version.test.mjs
      - name: Confirm preview and production deployment are isolated
        run: npm run check:cloudflare:deploy
      - name: Build original art and effects only if missing or pinned inputs changed
        run: npm run build:lrs:assets:status
      - name: Build original art, actual Effekseer resources and Vite app
        run: npm run build:cloudflare
      - name: Assert the art build is now reusable without re-preparing effects
        run: |
          npm run build:lrs:assets:status | grep '"reusable":true'
      - name: Verify complete local Worker release and original SHA-256 integrity
        run: npm run check:cloudflare:release
      - name: Validate Worker Static Assets deployment without publishing
        run: npm run deploy:cloudflare:dry-run
      - name: Verify that no LOC project or deployment files are created
        run: |
          test -s dist/cloudflare/index.html
          test -s dist/cloudflare/sw.js
          test ! -e dist/cloudflare/_redirects
          test -s dist/web-app/_redirects
          test -s dist/cloudflare/rune-release.json
          test -s dist/cloudflare/vendor/effekseer/effekseer.wasm
          test ! -d dist/cloudflare/.next
