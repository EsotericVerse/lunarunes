name: LRS iOS Device Unsigned IPA
run-name: LRS IPA · ${{ github.ref_name }} · ${{ github.sha }}

# Independent LunaRunes project. A manual LRS action alone can package LRS.
# No LOC checkout, LOC build, LOC workflow notification or automatic IPA release.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lrs-ios-device.yml'
      - 'capacitor.config.json'
      - 'web/src/runtime/rune-public-url.mjs'
      - 'web/src/main.jsx'
      - 'index.mjs'
      - 'tests/lrs-independent-ios.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lrs-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify LRS's independent iOS contract and native Worker origin
        run: node --test tests/lrs-independent-ios.test.mjs

  build-device-ipa:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: verify
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - name: Verify Xcode is available on LRS's own runner
        run: |
          xcodebuild -version
          xcrun --find swift
      - name: Install pinned LRS dependencies
        run: npm ci --no-audit --no-fund
      - name: Build LRS Web and pinned art as local IPA files
        run: |
          npm run build:cloudflare
          test -s dist/cloudflare/index.html
          test -s dist/cloudflare/assets/lunarunes/cards/00.png
          test -s dist/cloudflare/assets/lunarunes/cards/66.png
          test -s dist/cloudflare/vendor/effekseer/effekseer.wasm
      - name: Install Capacitor in this LRS job only
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund \
            '@capacitor/core@8.5.3' '@capacitor/ios@8.5.3' '@capacitor/cli@8.5.3'
          test -x node_modules/.bin/cap
      - name: Create LRS's temporary native iOS project
        run: |
          node_modules/.bin/cap add ios
          node_modules/.bin/cap sync ios
          test -s ios/App/App.xcodeproj/project.pbxproj
      - name: Compile unsigned iOS arm64 application
        env:
          LRS_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('release/version.json','utf8')).version")"
          test -n "$version"
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/lrs-ios-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$version" \
            CURRENT_PROJECT_VERSION="$LRS_BUILD_NUMBER" \
            build
      - name: Verify and package standalone unsigned LRS IPA
        id: package
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/lrs-ios-build/Build/Products/Debug-iphoneos/App.app"
          test -s "$app/Info.plist"
          test -s "$app/App"
          test -s "$app/public/index.html"
          test -s "$app/public/assets/lunarunes/cards/00.png"
          test -s "$app/public/assets/lunarunes/cards/66.png"
          test -s "$app/public/vendor/effekseer/effekseer.wasm"
          xcrun lipo -archs "$app/App" | tr ' ' '\n' | grep -qx arm64
          bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          test "$bundle" = 'cc.lo3rwang.lrs.mobile'
          mkdir -p dist/ipa "$RUNNER_TEMP/lrs-payload/Payload"
          ditto "$app" "$RUNNER_TEMP/lrs-payload/Payload/App.app"
          name="LRS-${{ github.run_number }}-device-unsigned.ipa"
          (cd "$RUNNER_TEMP/lrs-payload" && zip -qry "$GITHUB_WORKSPACE/dist/ipa/$name" Payload)
          unzip -t "$PWD/dist/ipa/$name" | tail -1
          echo "ipa_name=$name" >> "$GITHUB_OUTPUT"
          echo 'This IPA is unsigned, so it is not installable until Apple signing.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload LRS unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LRS-${{ github.run_number }}-device-unsigned
          path: dist/ipa/${{ steps.package.outputs.ipa_name }}
          if-no-files-found: error
          retention-days: 14
