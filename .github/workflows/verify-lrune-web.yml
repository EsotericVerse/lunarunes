name: Verify standalone lrune Web and engine
on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/lrunes/**'
      - 'modules/lrune/**'
      - 'modules/lrs/**'
      - 'web/**'
      - 'tests/lrs-web-static-cache.test.mjs'
      - 'tests/lrs-public-read-dedupe.test.mjs'
      - 'index.mjs'
      - 'lrs-database.mjs'
      - 'public-rune-read.mjs'
      - 'tests/lrs-original-pages.test.mjs'
      - 'tests/lrs-web-routes.test.mjs'
      - 'tests/lrs-original-page-parity.test.mjs'
      - 'tests/lrs-life-engine.test.mjs'
      - 'tests/lrs-gpu-lifecycle.test.mjs'
      - 'scripts/build-lrs-modules.mjs'
      - 'scripts/prepare-lrs-release-assets.mjs'
      - 'tests/lrune-core.test.mjs'
      - 'package.json'
      - 'cloudflare.config.ts'
      - 'scripts/assemble-rune-cloudflare.mjs'
      - '.github/workflows/verify-lrune-web.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  module-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install only the independent Rune module dependencies
        run: npm install --no-audit --no-fund
      - name: Keep generated npm lockfile for reproducible dependency pinning
        uses: actions/upload-artifact@v4
        with:
          name: lrune-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Build all four independent LRS ESM modules (no Vite, Worker or effects)
        run: npm run build:lrs:modules
      - name: Verify all lrs modules, loc:dialect port and real local board-game rules
        run: npm run check:lrs:modules
      - name: Verify LRS daily data ownership and legacy App/IPA model bridge
        run: node --test tests/lrs-daily-domain.test.mjs
      - name: Regression-check legacy module test
        run: npm run check:lrune:core
      - name: Verify importable module subpaths (rune/card/boardgame)
        run: npm run check:lrs:consumer
      - name: Check independent tabletop and Rune-life simulation engines
        run: node --test tests/lrs-life-engine.test.mjs
      - name: Verify portable lrs package excludes art binaries and build files
        run: npm run check:lrs:package
      - name: Regress 3D one-shot GPU release and aborted Rune reads
        run: node --test tests/lrs-gpu-lifecycle.test.mjs
      - name: Verify bounded Web-only static cache and transient anonymous public read coalescing
        run: node --test tests/lrs-web-static-cache.test.mjs tests/lrs-public-read-dedupe.test.mjs
      - name: Verify original LRS Web routes and native LOC card hub entry
        run: node --test tests/lrs-web-routes.test.mjs
      - name: Verify original Rune screen parity and private daily boundaries
        run: node --test tests/lrs-original-page-parity.test.mjs
      - name: Verify read-only original-page transport and real upstream response contract
        run: node --test tests/lrs-original-pages.test.mjs
      - name: Assert module artifacts are separate from Web and iOS release
        run: |
          test -s dist/modules/rune.json
          test -s dist/modules/boardgame.json
          test -s dist/modules/card.json
          test -s dist/modules/daily.json
          test ! -e dist/cloudflare/index.html
      - name: Build standalone Rune Web (LOC and LunArcus are not required)
        run: npm run build:web
      - name: Verify independent build has no bundled original art/WASM
        run: |
          test -s dist/web-app/index.html
          test -s dist/web-app/sw.js
          test -s dist/web-app/_redirects
          test ! -e dist/web-app/vendor/effekseer/effekseer.wasm
          test ! -e dist/web-app/assets/lunarunes/cards/00.png
          find dist/web-app -maxdepth 2 -type f | sort
