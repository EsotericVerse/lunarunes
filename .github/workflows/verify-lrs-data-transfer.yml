name: Verify LRS data ownership and offline cutover (no deployment)
on:
  pull_request:
    branches: [main]
    paths:
      - 'contracts/lrs-data-ownership.json'
      - 'scripts/lrs-data-handoff.mjs'
      - 'tests/lrs-data-handoff.test.mjs'
      - 'tests/lrs-data-boundary.test.mjs'
      - 'modules/lrs/card/**'
      - 'modules/lrs/daily/**'
      - 'web/src/runtime/rune-dialect.mjs'
      - 'worker/**'
      - '.github/workflows/verify-lrs-data-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify owner-only migration bundle, row parity and private boundaries
        run: node --test tests/lrs-data-handoff.test.mjs tests/lrs-data-boundary.test.mjs
      - name: Check CLI syntax only (no SQL dialect or live database access)
        run: node --check scripts/lrs-data-handoff.mjs
      - name: Confirm no deployment, secrets or cross-repo changes
        run: echo 'Offline data contract gate only; no URL changes, SQL actions, migration or deployment'
